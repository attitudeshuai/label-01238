version: '3.8'

# 商业购物管理系统 Docker Compose 配置
# 重要：生产环境请通过 .env 文件或环境变量设置敏感信息
services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: shop-mysql
    restart: always
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shop_db}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - shop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shop-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8238}:8238"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      JWT_SECRET: ${JWT_SECRET:-shop-management-system-jwt-secret-key-dev-only}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-demo-key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      TZ: Asia/Shanghai
      JAVA_OPTS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shop-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shop-frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - shop-network

networks:
  shop-network:
    driver: bridge

volumes:
  mysql_data:
